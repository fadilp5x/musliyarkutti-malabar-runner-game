<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" id="obstacle_bus">
  <defs>
    <linearGradient id="busBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="320" cy="360" rx="280" ry="22" fill="#000000" opacity="0.4"/>

  <!-- Bus Main Chassis -->
  <rect x="50" y="70" width="540" height="260" rx="24" fill="url(#busBodyGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Destination Board (Kozhikode - Malabar) -->
  <rect x="230" y="80" width="180" height="26" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="2">MALABAR EXP</text>

  <!-- Front Windshield & Side Windows Grid -->
  <rect x="65" y="115" width="80" height="110" rx="8" fill="url(#windowGlass)" stroke="#0f172a" stroke-width="2"/>
  <rect x="155" y="115" width="75" height="75" rx="6" fill="url(#windowGlass)" stroke="#0f172a" stroke-width="2"/>
  <rect x="240" y="115" width="75" height="75" rx="6" fill="url(#windowGlass)" stroke="#0f172a" stroke-width="2"/>
  <rect x="325" y="115" width="75" height="75" rx="6" fill="url(#windowGlass)" stroke="#0f172a" stroke-width="2"/>
  <rect x="410" y="115" width="75" height="75" rx="6" fill="url(#windowGlass)" stroke="#0f172a" stroke-width="2"/>
  <rect x="495" y="115" width="80" height="110" rx="8" fill="url(#windowGlass)" stroke="#0f172a" stroke-width="2"/>

  <!-- Front Headlight Cluster & Grille -->
  <rect x="55" y="270" width="30" height="18" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="555" y="270" width="30" height="18" rx="4" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
  <rect x="95" y="265" width="70" height="28" rx="4" fill="#1e293b"/>
  <line x1="100" y1="272" x2="160" y2="272" stroke="#64748b" stroke-width="2"/>
  <line x1="100" y1="279" x2="160" y2="279" stroke="#64748b" stroke-width="2"/>
  <line x1="100" y1="286" x2="160" y2="286" stroke="#64748b" stroke-width="2"/>

  <!-- Heavy Rubber Bumper -->
  <rect x="44" y="306" width="552" height="24" rx="6" fill="#0f172a"/>

  <!-- Detailed Wheel Wells & Wheels -->
  <!-- Front Wheel -->
  <ellipse cx="140" cy="330" rx="42" ry="42" fill="#0f172a"/>
  <circle cx="140" cy="330" r="28" fill="url(#wheelRim)"/>
  <circle cx="140" cy="330" r="10" fill="#475569"/>
  <!-- Rear Dual Wheels -->
  <ellipse cx="480" cy="330" rx="42" ry="42" fill="#0f172a"/>
  <circle cx="480" cy="330" r="28" fill="url(#wheelRim)"/>
  <circle cx="480" cy="330" r="10" fill="#475569"/>
</svg>
