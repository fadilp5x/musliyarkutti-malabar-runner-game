<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 400" width="100%" height="100%" id="obstacle_handcart">
  <!-- Ground Shadow -->
  <ellipse cx="256" cy="360" rx="180" ry="18" fill="#000000" opacity="0.35"/>
  <!-- Wooden Bed Plank -->
  <rect x="80" y="210" width="340" height="24" rx="4" fill="#78350f" stroke="#451a03" stroke-width="3"/>
  <!-- Side Timber Slats -->
  <rect x="80" y="160" width="12" height="60" fill="#92400e"/>
  <rect x="245" y="160" width="12" height="60" fill="#92400e"/>
  <rect x="408" y="160" width="12" height="60" fill="#92400e"/>
  <line x1="80" y1="170" x2="420" y2="170" stroke="#78350f" stroke-width="6"/>
  <!-- Loaded Burlap Sacks & Crates -->
  <path d="M 110 160 Q 150 110 190 160 Z" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <path d="M 180 160 Q 230 90 280 160 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <path d="M 270 160 Q 320 100 370 160 Z" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <rect x="340" y="110" width="55" height="50" fill="#a16207" stroke="#451a03" stroke-width="2"/>
  <!-- Handle Shaft -->
  <line x1="80" y1="220" x2="30" y2="240" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
  <!-- Large Wooden Spoke Wheels -->
  <circle cx="180" cy="290" r="65" fill="none" stroke="#451a03" stroke-width="12"/>
  <circle cx="180" cy="290" r="14" fill="#78350f"/>
  <line x1="180" y1="225" x2="180" y2="355" stroke="#78350f" stroke-width="5"/>
  <line x1="115" y1="290" x2="245" y2="290" stroke="#78350f" stroke-width="5"/>
  <circle cx="320" cy="290" r="65" fill="none" stroke="#451a03" stroke-width="12"/>
  <circle cx="320" cy="290" r="14" fill="#78350f"/>
  <line x1="320" y1="225" x2="320" y2="355" stroke="#78350f" stroke-width="5"/>
  <line x1="255" y1="290" x2="385" y2="290" stroke="#78350f" stroke-width="5"/>
</svg>
