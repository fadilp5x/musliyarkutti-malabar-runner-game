<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" id="shaytan_warning">
  <defs>
    <radialGradient id="warnAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#b91c1c" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#7f1d1d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="warnGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes warnPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes eyeSparks {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
    }
    #warn-master { animation: warnPulse calc(var(--anim-speed, 1s) * 0.8) infinite ease-in-out; transform-origin: 256px 256px; }
  </style>
  <g id="warn-master" filter="url(#warnGlow)">
    <circle cx="256" cy="256" r="180" fill="url(#warnAura)"/>
    <!-- Outer Arc Claws -->
    <path d="M 170 180 C 130 220 130 292 170 332" stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 342 180 C 382 220 382 292 342 332" stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 200 150 C 170 190 170 322 200 362" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 312 150 C 342 190 342 322 312 362" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
    <!-- Central Menacing Slit Eye Core -->
    <path d="M 206 256 Q 256 200 306 256 Q 256 312 206 256 Z" fill="#09090b" stroke="#ef4444" stroke-width="4"/>
    <ellipse cx="256" cy="256" rx="14" ry="34" fill="#ef4444"/>
    <ellipse cx="256" cy="256" rx="6" ry="24" fill="#ffffff"/>
  </g>
</svg>
