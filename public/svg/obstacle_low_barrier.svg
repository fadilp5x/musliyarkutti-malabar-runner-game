<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 400" width="100%" height="100%" id="obstacle_low_barrier">
  <!-- Shadow -->
  <ellipse cx="256" cy="370" rx="190" ry="16" fill="#000000" opacity="0.35"/>
  <!-- Left & Right A-Frame Legs -->
  <polygon points="70,360 90,360 130,150 110,150" fill="#92400e" stroke="#451a03" stroke-width="2"/>
  <polygon points="120,360 140,360 100,150 80,150" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <polygon points="380,360 400,360 440,150 420,150" fill="#92400e" stroke="#451a03" stroke-width="2"/>
  <polygon points="430,360 450,360 410,150 390,150" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <!-- Horizontal Striped Caution Board -->
  <rect x="60" y="170" width="392" height="65" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <!-- Red Caution Stripes -->
  <polygon points="80,170 120,170 80,235 40,235" fill="#ef4444"/>
  <polygon points="150,170 190,170 150,235 110,235" fill="#ef4444"/>
  <polygon points="220,170 260,170 220,235 180,235" fill="#ef4444"/>
  <polygon points="290,170 330,170 290,235 250,235" fill="#ef4444"/>
  <polygon points="360,170 400,170 360,235 320,235" fill="#ef4444"/>
  <polygon points="430,170 452,170 430,235 390,235" fill="#ef4444"/>
  <!-- Bold Alert Text -->
  <text x="256" y="210" font-family="sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">CAUTION • വഴി അടച്ചിരിക്കുന്നു</text>
</svg>
