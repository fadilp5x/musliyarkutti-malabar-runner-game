<svg xmlns="http://www.w3.org/2000/svg" id="shaytan_disappear" width="100%" height="100%" viewBox="0 0 512 512"><defs><radialGradient id="shaytanAura" cx="50%" cy="35%" r="65%"><stop offset="0%" stop-color="#1f2937" stop-opacity=".9"/><stop offset="50%" stop-color="#111827" stop-opacity=".95"/><stop offset="90%" stop-color="#030712" stop-opacity="1"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient><radialGradient id="eyeCrimson" cx="45%" cy="40%" r="55%"><stop offset="0%" stop-color="#fff"/><stop offset="30%" stop-color="#f87171"/><stop offset="70%" stop-color="#dc2626"/><stop offset="100%" stop-color="#7f1d1d"/></radialGradient><filter id="shadowMistFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes shaytanBillow{0%{transform:translateY(0) scaleY(1) skewX(0deg)}50%{transform:translateY(-12px) scaleY(1.025) skewX(1.5deg)}}@keyframes eyeGaze{0%{opacity:.95;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}@keyframes smokeCurlL{0%{transform:rotate(0deg)}50%{transform:rotate(-6deg) translateY(-8px)}}@keyframes smokeCurlR{0%{transform:rotate(0deg)}50%{transform:rotate(6deg) translateY(-8px)}}#shaytan-rig{animation:shaytanBillow calc(var(--anim-speed, 1s)*1.2) infinite ease-in-out;transform-origin:256px 400px}.eye-element{animation:eyeGaze .8s infinite alternate ease-in-out}.tendril-l{animation:smokeCurlL 1.4s infinite ease-in-out;transform-origin:150px 200px}.tendril-r{animation:smokeCurlR 1.4s infinite ease-in-out;transform-origin:360px 200px}</style><ellipse cx="256" cy="465" fill="#000" opacity=".45" rx="140" ry="24"/><g id="shaytan-rig" filter="url(#shadowMistFilter)"><path fill="#0f172a" d="M 170 120 C 110 80 80 150 70 230 C 60 290 100 350 140 370 C 110 300 130 220 170 120 Z" class="tendril-l" opacity=".85"/><path fill="#0f172a" d="M 342 120 C 402 80 432 150 442 230 C 452 290 412 350 372 370 C 402 300 382 220 342 120 Z" class="tendril-r" opacity=".85"/><path fill="url(#shaytanAura)" d="M 256 60 C 200 60 170 105 160 160 C 145 220 120 280 140 360 C 155 420 210 460 256 460 C 302 460 357 420 372 360 C 392 280 367 220 352 160 C 342 105 312 60 256 60 Z"/><g class="tendril-l"><path fill="#090d16" d="M 180 160 C 120 180 90 230 75 300 C 65 345 80 360 95 350 C 105 340 105 310 120 270 C 135 230 160 200 180 160 Z"/><path stroke="#1e293b" stroke-linecap="round" stroke-width="4" d="M 75 300 Q 60 325 50 340"/><path stroke="#1e293b" stroke-linecap="round" stroke-width="4" d="M 85 310 Q 75 338 68 355"/><path stroke="#1e293b" stroke-linecap="round" stroke-width="4" d="M 95 320 Q 90 345 85 365"/></g><g class="tendril-r"><path fill="#090d16" d="M 332 160 C 392 180 422 230 437 300 C 447 345 432 360 417 350 C 407 340 407 310 392 270 C 377 230 352 200 332 160 Z"/><path stroke="#1e293b" stroke-linecap="round" stroke-width="4" d="M 437 300 Q 452 325 462 340"/><path stroke="#1e293b" stroke-linecap="round" stroke-width="4" d="M 427 310 Q 437 338 444 355"/><path stroke="#1e293b" stroke-linecap="round" stroke-width="4" d="M 417 320 Q 422 345 427 365"/></g><path fill="#000" d="M 180 390 C 210 440 240 460 256 460 C 272 460 302 440 332 390 C 310 430 280 448 256 448 C 232 448 202 430 180 390 Z"/><g class="eye-element" transform="translate(0, 0)"><path fill="url(#eyeCrimson)" d="M 215 145 Q 235 135 248 150 Q 235 155 215 145 Z"/><ellipse cx="236" cy="145" fill="#fff" rx="3" ry="5"/><path fill="url(#eyeCrimson)" d="M 297 145 Q 277 135 264 150 Q 277 155 297 145 Z"/><ellipse cx="276" cy="145" fill="#fff" rx="3" ry="5"/><path fill="none" stroke="#ef4444" stroke-width="2" d="M 230 132 Q 256 138 282 132" opacity=".65"/></g></g></svg>