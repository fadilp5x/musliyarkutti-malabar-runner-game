<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" id="obstacle_smartphone_portal">
  <defs>
    <linearGradient id="portalFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="85%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="portalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenMask"><rect x="146" y="84" width="220" height="352" rx="22"/></clipPath>
  </defs>
  <style>
    @keyframes vortexSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes portalHover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    #portal-body { animation: portalHover calc(var(--anim-speed, 1s) * 1.5) infinite ease-in-out; }
    .vortex-spin { animation: vortexSpin calc(var(--anim-speed, 1s) * 2.5) infinite linear; transform-origin: 256px 256px; }
  </style>
  <ellipse cx="256" cy="480" rx="140" ry="20" fill="#000000" opacity="0.4"/>
  <g id="portal-body">
    <!-- Smartphone Bezel Frame -->
    <rect x="136" y="50" width="240" height="400" rx="36" fill="url(#portalFrame)" stroke="#475569" stroke-width="6" filter="url(#portalGlow)"/>
    <rect x="142" y="56" width="228" height="388" rx="30" fill="none" stroke="#06b6d4" stroke-width="4"/>
    <!-- Speaker & Pin Camera Notch -->
    <rect x="226" y="66" width="60" height="8" rx="4" fill="#0f172a"/>
    <circle cx="270" cy="70" r="2.5" fill="#1e293b"/>
    <!-- Swirling Cosmic Vortex Screen -->
    <g clip-path="url(#screenMask)">
      <rect x="146" y="84" width="220" height="352" fill="#0284c7"/>
      <ellipse cx="256" cy="256" rx="130" ry="180" fill="url(#portalCore)"/>
      <g class="vortex-spin">
        <ellipse cx="256" cy="256" rx="80" ry="120" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="35 25" opacity="0.8"/>
        <ellipse cx="256" cy="256" rx="55" ry="90" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="20 15"/>
        <ellipse cx="256" cy="256" rx="30" ry="50" fill="none" stroke="#a5f3fc" stroke-width="4" stroke-dasharray="14 10"/>
      </g>
    </g>
  </g>
</svg>
